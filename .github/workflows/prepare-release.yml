name: Prepare TypeScript SDK release

on:
  workflow_dispatch:
    inputs:
      api_release_tag:
        description: Reviewed API release tag
        required: true
        type: string
      sdk_version:
        description: New experimental SDK version without v
        required: true
        type: string
      breaking_notes:
        description: One approved breaking note per line
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: release/sdk-typescript-v${{ inputs.sdk_version }}
      SDK_BREAKING_NOTES: ${{ inputs.breaking_notes }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Enable pinned pnpm
        run: corepack enable && corepack install

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare version, changelog, and provenance
        run: >-
          node scripts/prepare-sdk-release.mjs "${{ inputs.api_release_tag }}"
          "${{ inputs.sdk_version }}" "$GITHUB_SHA"

      - name: Run complete quality gates
        run: pnpm check && pnpm pack:check

      - name: Create one release pull request
        shell: bash
        run: |
          git add CHANGELOG.md packages/typescript/package.json releases
          git config user.name "messijo-sdk-release[bot]"
          git config user.email "messijo-sdk-release[bot]@users.noreply.github.com"
          git switch -C "$RELEASE_BRANCH"
          git commit -m "Prepare @messijo/sdk ${{ inputs.sdk_version }}"
          git push --force-with-lease origin "HEAD:$RELEASE_BRANCH"
          existing="$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$RELEASE_BRANCH" \
              --title "Prepare @messijo/sdk ${{ inputs.sdk_version }}" \
              --body "Reviewed experimental SDK release preparation with complete API and generator provenance."
          fi
