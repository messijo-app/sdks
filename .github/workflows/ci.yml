name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Enable pinned pnpm
        run: corepack enable && corepack install

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gates
        run: pnpm check

      - name: Verify deterministic generated source
        run: pnpm generate:check

      - name: Inspect tarball and run packed consumer
        run: pnpm pack:check

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24.16.0]
        typescript: [6, 7]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pinned pnpm
        run: corepack enable && corepack install

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check with TypeScript ${{ matrix.typescript }}
        run: pnpm typecheck:ts${{ matrix.typescript }}

      - name: Run consumer and browser-like tests
        run: pnpm test
