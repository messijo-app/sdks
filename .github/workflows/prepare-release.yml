name: Prepare TypeScript SDK release candidate
run-name:
  TypeScript SDK v${{ inputs.sdk_version }} for ${{ inputs.api_release_tag }}
  from ${{ github.ref_name }} at ${{ github.sha }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      api_release_tag:
        description:
          Reviewed API release tag with a merged receipt and TypeScript bump
          (example api-v0.2.0)
        required: true
        type: string
      sdk_version:
        description:
          New experimental TypeScript SDK SemVer without v (example 0.3.0)
        required: true
        type: string
      breaking_notes:
        description:
          Approved breaking notes, one per line; required when the reviewed bump
          is breaking
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      selected_ref: ${{ steps.candidate.outputs.selected_ref }}
      default_branch: ${{ steps.candidate.outputs.default_branch }}
      eligibility_result: ${{ steps.candidate.outputs.eligibility_result }}
    steps:
      - name: Check out immutable dispatch candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch current default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run:
          git fetch --no-tags origin
          "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Validate branch-selected release candidate
        id: candidate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          node scripts/validate-release-candidate.mjs "${{
          inputs.api_release_tag }}" typescript

      - name: Summarize candidate validation
        if: always()
        env:
          CANDIDATE_SHA:
            ${{ steps.candidate.outputs.candidate_sha || github.sha }}
          DEFAULT_BRANCH:
            ${{ steps.candidate.outputs.default_branch ||
            github.event.repository.default_branch }}
          ELIGIBILITY:
            ${{ steps.candidate.outputs.eligibility_result || 'ineligible' }}
          SELECTED_REF:
            ${{ steps.candidate.outputs.selected_ref || github.ref }}
        run: |
          {
            echo "## TypeScript release candidate validation"
            echo
            echo "- Selected ref: \`${SELECTED_REF}\`"
            echo "- Immutable candidate SHA: \`${CANDIDATE_SHA}\`"
            echo "- Current default branch: \`${DEFAULT_BRANCH}\`"
            echo "- Eligibility: **${ELIGIBILITY}**"
            echo "- API release: \`${{ inputs.api_release_tag }}\`"
            echo "- Requested SDK version: \`${{ inputs.sdk_version }}\`"
            if [[ "${ELIGIBILITY}" != "eligible" ]]; then
              echo "- Recovery: inspect the validation stage, then retry from a branch whose dispatch-time tip is already merged into the current default branch. Escalate receipt or bump conflicts to the contract-intake owner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: release/sdk-typescript-v${{ inputs.sdk_version }}
      SDK_BREAKING_NOTES: ${{ inputs.breaking_notes }}
    steps:
      - name: Check out the same immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-candidate.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Fetch current default branch again
        env:
          DEFAULT_BRANCH: ${{ needs.validate-candidate.outputs.default_branch }}
        run:
          git fetch --no-tags origin
          "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Repeat candidate validation before mutation
        id: repeated-candidate
        env:
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
          DEFAULT_BRANCH: ${{ needs.validate-candidate.outputs.default_branch }}
          SELECTED_REF: ${{ needs.validate-candidate.outputs.selected_ref }}
        run: >-
          node scripts/validate-release-candidate.mjs "${{
          inputs.api_release_tag }}" typescript

      - name: Derive checked-out release provenance
        id: provenance
        env:
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
        run: |
          sdk_commit="$(git rev-parse HEAD)"
          test "$sdk_commit" = "$CANDIDATE_SHA"
          echo "sdk_commit=$sdk_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Enable pinned pnpm
        run: corepack enable && corepack install

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare version, changelog, and provenance
        run: >-
          node scripts/prepare-sdk-release.mjs "${{ inputs.api_release_tag }}"
          "${{ inputs.sdk_version }}" "${{ steps.provenance.outputs.sdk_commit
          }}"

      - name: Format generated changelog and other artifacts
        run: pnpm format

      - name: Run complete quality gates
        run: pnpm check && pnpm pack:check

      - name: Create or update one release pull request
        id: release-pr
        shell: bash
        run: |
          git add CHANGELOG.md packages/typescript/package.json releases
          git config user.name "messijo-sdk-release[bot]"
          git config user.email "messijo-sdk-release[bot]@users.noreply.github.com"
          git switch -C "$RELEASE_BRANCH"
          git commit -m "Prepare @messijo/sdk ${{ inputs.sdk_version }}"
          git fetch origin "$RELEASE_BRANCH" || true
          git push --force-with-lease origin "HEAD:$RELEASE_BRANCH"
          pr_url="$(gh pr list --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create \
              --base "${{ needs.validate-candidate.outputs.default_branch }}" \
              --head "$RELEASE_BRANCH" \
              --title "Prepare @messijo/sdk ${{ inputs.sdk_version }}" \
              --body "Reviewed experimental TypeScript SDK release from candidate ${{ needs.validate-candidate.outputs.candidate_sha }} with complete API and generator provenance.")"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Summarize release preparation
        if: always()
        env:
          PR_URL: ${{ steps.release-pr.outputs.pr_url }}
        run: |
          {
            echo "## TypeScript release preparation"
            echo
            echo "- Selected ref: \`${{ needs.validate-candidate.outputs.selected_ref }}\`"
            echo "- Immutable candidate SHA: \`${{ needs.validate-candidate.outputs.candidate_sha }}\`"
            echo "- Eligibility: **${{ needs.validate-candidate.outputs.eligibility_result }}**"
            echo "- API release: \`${{ inputs.api_release_tag }}\`"
            echo "- Requested SDK version: \`${{ inputs.sdk_version }}\`"
            echo "- Release branch: \`${RELEASE_BRANCH}\`"
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "- Pull request: ${PR_URL}"
              echo "- Next action: review and merge the release pull request; then create the protected tag at its exact default-branch commit."
            else
              echo "- Result: preparation failed before a confirmed pull-request handoff."
              echo "- Recovery: inspect the failed stage. Retry with the same inputs only after confirming no conflicting release branch or pull request; escalate trust-input conflicts to the contract-intake owner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
